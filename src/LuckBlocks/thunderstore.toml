[config]
schemaVersion = "0.1.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "legocool"
name = "Lucky_Blocks"
description = "Adds Lucky Blocks with randomized effects. Over 30 good and bad outcomes."
websiteUrl = "https://github.com/lego2cool/PEAK-LuckyBlocks" 
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.2403"
PEAKModding-PEAKLib_Items = "1.6.0"
PEAKModding-PEAKLib_Core = "1.7.2"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/LuckBlocks/release/legocool.LuckyBlocks.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

[[build.copy]]
source = "../../bundles/luckyblock.peakbundle"
target = "plugins/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "peak", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/peak/category/
peak = [ "mods", ]
